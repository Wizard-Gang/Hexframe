# A tag may only become a release if that exact annotated tag reproduces the product state.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release event boundary
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "::error::unauthorized release event $GITHUB_EVENT_NAME"; exit 1 ;;
          esac
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::release requires a tag ref"; exit 1; }
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::release requires exact semantic tag"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME" ] || { echo "::error::release ref does not match tag"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@12.1.0

      - name: Validate immutable release identity
        run: npm run verify:release-identity -- --tag "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE" --fetch-origin

      - name: Reproduce the tagged state
        run: |
          npm ci
          npm run check

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  deploy:
    needs: reproduce
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    # Preserve the called job's protected production environment secret context.
    secrets: inherit
