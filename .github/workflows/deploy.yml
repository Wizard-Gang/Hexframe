# Production deploys only the immutable tag event validated by the Release workflow.
name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag from the calling tag event
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          # Reusable workflows inherit the caller's ref. Never checkout an arbitrary
          # caller-supplied ref for production.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Validate release event and exact tagged commit
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_TYPE" = "tag" ] || { echo "::error::production deploy requires a tag event"; exit 1; }
          [ "$GITHUB_REF_NAME" = "$EXPECTED_TAG" ]             || { echo "::error::workflow input $EXPECTED_TAG does not match event tag $GITHUB_REF_NAME"; exit 1; }

          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::$GITHUB_REF_NAME is not a semantic-version release tag"; exit 1 ;;
          esac

          tag_ref="refs/tags/$GITHUB_REF_NAME"
          git fetch --force --no-tags origin "$tag_ref:$tag_ref"
          [ "$(git cat-file -t "$tag_ref")" = "tag" ]             || { echo "::error::$GITHUB_REF_NAME is not an annotated tag"; exit 1; }

          package_version="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "v$package_version" ]             || { echo "::error::tag $GITHUB_REF_NAME does not match package version v$package_version"; exit 1; }

          tagged_commit="$(git rev-parse "$tag_ref^{}")"
          checked_out_commit="$(git rev-parse HEAD)"
          [ "$tagged_commit" = "$checked_out_commit" ]             || { echo "::error::production checkout $checked_out_commit is not tagged commit $tagged_commit"; exit 1; }

      - name: Reproduce before deploying
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build with deployment identity
        env:
          RELEASE: ${{ github.ref_name }}
        run: npm run build

      - name: Resolve deployed commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy exact release tag
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --env production 2>&1 | tee /tmp/deploy.log
          version=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' /tmp/deploy.log | tail -1)
          [ -n "$version" ] || { echo "::error::could not read the deployed Version ID from wrangler output"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Uploaded version $version"

      - name: Confirm the uploaded version is live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          npx wrangler deployments list --env production > /tmp/deployments.txt 2>&1 || {
            cat /tmp/deployments.txt; echo "::error::could not list deployments"; exit 1; }
          newest=$(grep -E '^Version\(s\):' /tmp/deployments.txt | tail -1)
          echo "newest deployment: $newest"
          printf '%s' "$newest" | grep -q "$VERSION" \
            || { echo "::error::the live deployment is not $VERSION"; exit 1; }
          printf '%s' "$newest" | grep -q '(100%)' \
            || { echo "::error::$VERSION is not serving 100% of traffic"; exit 1; }
          echo "Production is serving $VERSION at 100%"

      - name: Public identity check
        env:
          RELEASE: ${{ github.ref_name }}
          COMMIT: ${{ steps.target.outputs.sha }}
          HOST: ${{ vars.PRODUCTION_HOST }}
        run: |
          sleep 10
          code=$(curl -s -o /tmp/version.json -D /tmp/headers.txt -w '%{http_code}' "https://$HOST/version.json" || echo 000)
          if [ "$code" = "200" ]; then
            live=$(cat /tmp/version.json); echo "$live"
            [ "$(printf '%s' "$live" | jq -r .release)" = "$RELEASE" ] \
              || { echo "::error::production release != $RELEASE"; exit 1; }
            [ "$(printf '%s' "$live" | jq -r .commit)" = "$COMMIT" ] \
              || { echo "::error::production commit != $COMMIT"; exit 1; }
            echo "Public identity matches $RELEASE @ $COMMIT"
          elif grep -qi '^cf-mitigated: *challenge' /tmp/headers.txt; then
            echo "::warning::$HOST issued a Cloudflare managed challenge to this runner (HTTP $code); authenticated deployment verification already passed."
          else
            echo "::warning::could not read https://$HOST/version.json (HTTP $code); authenticated deployment verification already passed"
          fi
