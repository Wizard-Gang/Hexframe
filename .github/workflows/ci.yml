name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Local dev lifecycle smoke
        if: github.event_name == 'pull_request'
        run: npm run test:dev-smoke

      - name: Whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA..$HEAD_SHA"

  change-id:
    # Every controlled change carries exactly one permanent ID and one primary type.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          pattern='^\[HF-[0-9]{3,}\] \[(INIT|FEAT|FIX|SEC|API|A11Y|I18N|AI|DB|OPS|TEST|DOCS|REFACTOR|PERF|BUILD|REVERT|CHORE)\] .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must match [HF-###] [TYPE] <imperative summary>"
            exit 1
          fi

  secrets:
    # A public repository must never carry a credential in any commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan tracked tree for credential material
        run: |
          set -o pipefail
          NAMES="ADMIN_PASSWORD|ADMIN_SESSION_SECRET|CLOUDFLARE_API_TOKEN|CLOUDFLARE_ACCOUNT_ID|GITHUB_TOKEN"
          # Assignment by "=" or object-literal ":", with a non-empty value.
          # Values beginning "test-" are permitted: they are deliberate test doubles with
          # no production meaning. Every other assigned value fails the build.
          ASSIGN="($NAMES)[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9_/+-]{8,}"

          if git ls-files | grep -Ev '(^|/)\.env\.example$' \
             | grep -E '(^|/)(\.env($|\.)|\.dev\.vars|.*\.(pem|key|p12|pfx)$|id_rsa)'; then
            echo "::error::Credential-bearing file is tracked"
            exit 1
          fi

          if git grep -nEI "$ASSIGN" -- . ':!*.md' | grep -Ev "[\"']test-"; then
            echo "::error::Assigned secret value found in tracked content"
            exit 1
          fi

          if git grep -nEI 'BEGIN (RSA |OPENSSH |EC |PGP )?PRIVATE KEY' -- .; then
            echo "::error::Private key material found"
            exit 1
          fi

          echo "No credential material in tracked tree."
